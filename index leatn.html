<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn &amp; Fix</title>
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap">
<style>
  :root{
    --blue:#1d4ed8; --blue-soft:#dbeafe; --ink:#111827; --muted:#6b7280;
    --bg:#f8fafc; --card:#ffffff; --green:#15803d; --green-soft:#dcfce7;
    --red:#b91c1c; --red-soft:#fee2e2; --amber:#f59e0b; --line:#e5e7eb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}
  header{background:var(--blue);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
  header h1{font-size:20px;margin:0;font-weight:700}
  header button[aria-pressed="true"]{background:#fff;color:var(--blue)}
  header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:15px}
  main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .muted{color:var(--muted);font-size:15px}
  .row{display:flex;gap:10px;align-items:center}
  .big{font-size:26px;font-weight:700}
  .huge{font-size:40px;font-weight:700;letter-spacing:.5px}
  button.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-weight:600;font-size:20px;background:var(--blue);color:#fff;margin-top:10px}
  button.btn.alt{background:var(--blue-soft);color:var(--blue)}
  button.btn.green{background:var(--green)}
  button.btn:disabled{opacity:.45}
  .opts{display:grid;gap:10px;margin-top:12px}
  .opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:16px;font:inherit;font-size:24px;font-weight:600;text-align:center;color:var(--ink)}
  .opt.right{border-color:var(--green);background:var(--green-soft)}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)}
  .speak{background:var(--blue-soft);color:var(--blue);border:0;border-radius:50%;width:56px;height:56px;font-size:26px;flex:none}
  .wordcard{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:#fff;width:100%;font:inherit;text-align:left;color:var(--ink)}
  .wordcard .emoji{font-size:34px;width:44px;text-align:center}
  .wordcard .w{font-size:30px;font-weight:700}
  .day{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:10px;width:100%;font:inherit;text-align:left;color:var(--ink)}
  .day .num{width:44px;height:44px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700;flex:none}
  .day.done .num{background:var(--green-soft);color:var(--green)}
  .day.locked{opacity:.5}
  .day .t{flex:1}
  .stars{font-size:22px;letter-spacing:2px}
  .progress{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
  .progress > div{height:100%;background:var(--green);width:0}
  .steps{display:flex;gap:4px;margin-bottom:14px}
  .steps span{flex:1;height:6px;border-radius:4px;background:var(--line)}
  .steps span.on{background:var(--blue)}
  .sentence{font-size:30px;font-weight:600;line-height:1.6;margin:8px 0}
  .sentence .wd{padding:2px 3px;border-radius:6px}
  .sentence .wd.hl{background:#fde68a}
  .video{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin-top:10px}
  .video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .feedback{font-weight:600;margin-top:10px;min-height:28px}
  .feedback.ok{color:var(--green)} .feedback.no{color:var(--red)}
  input[type=text]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
  .pill{display:inline-block;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:600}
  .center{text-align:center}
  .hidden{display:none}
  .timer{font-size:15px;color:#fff;opacity:.9}
</style>
</head>
<body>
<header>
  <h1 id="hdrTitle">Learn &amp; Fix</h1>

/* ================= STORAGE ================= */
const KEY = "learnfix_v1";
function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ return null; }
}
let S = load() || {level:1, goodStreak:0, results:{}, unlockAll:false, myLinks:[]};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
const today = () => new Date().toISOString().slice(0,10);

/* ================= VOICE ================= */
let voice = null;
function englishVoices(){
  return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
}
function pickVoice(){
  const vs = englishVoices();
  voice = (S.voiceName && vs.find(v=>v.name===S.voiceName))
       || vs.find(v=>/google/i.test(v.name) && /en.GB/i.test(v.lang))
       || vs.find(v=>/en.GB/i.test(v.lang))
       || vs.find(v=>/google/i.test(v.name))
       || vs[0] || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, onWord, onEnd){
  if (!("speechSynthesis" in window)) { onEnd && onEnd(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.lang = voice ? voice.lang : "en-GB";
  u.rate = S.slow ? 0.7 : 1; u.pitch = 1;
  if (onWord) u.onboundary = e => { if (e.name === "word" || e.charIndex !== undefined) onWord(e.charIndex); };
  u.onend = () => onEnd && onEnd();
  speechSynthesis.speak(u);
}

/* ================= HELPERS ================= */
const app = document.getElementById("app");
const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstChild; };
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const targetMinutes = () => Math.min(25, 15 + (S.level-1)*2);
const starsFor = s => s >= .9 ? 3 : s >= .7 ? 2 : 1;
const praise = ["Well done!","Good job!","Very good!","Yes! That is right!","Great!"];
const pickPraise = () => praise[Math.floor(Math.random()*praise.length)];

function isUnlocked(i){
  if (S.unlockAll || i === 0) return true;
  const prev = S.results[i-1];
  if (!prev) return false;
  if (S.results[i]) return true;
  return prev.date < today();   // one new lesson per day
}
function nextDayIndex(){
  for (let i=0;i<DAYS.length;i++) if (!S.results[i]) return i;
  return -1;
}

/* ================= HOME ================= */
function home(){
  stopTimer();
  setHeader("Learn & Fix", "Progress", progressPage);
  const done = Object.keys(S.results).length;
  const n = nextDayIndex();
  app.innerHTML = "";
  const top = $(`<div class="card">
      <div class="big">Hello! 👋</div>
      <div class="muted">One small lesson every day. Reading, numbers and cars.</div>
      <div style="margin-top:10px" class="row"><span class="pill">⏱ ${targetMinutes()} minutes a day</span><span class="pill">Level ${S.level}</span></div>
      <div class="progress"><div style="width:${done/DAYS.length*100}%"></div></div>
      <div class="muted" style="margin-top:4px">${done} of ${DAYS.length} days done this week</div>
    </div>`);
  app.appendChild(top);

  if (n >= 0){
    const can = isUnlocked(n);
    const b = $(`<button class="btn ${can?'':'alt'}">${can ? "▶ Start today's lesson" : "✔ Come back tomorrow"}</button>`);
    b.onclick = () => can ? startLesson(n) : say("Good work today. Come back tomorrow for the next lesson.");
    app.appendChild(b);
    if (!can) app.appendChild($(`<p class="muted center">Today's lesson is finished. The next one opens tomorrow.</p>`));
  } else {
    app.appendChild($(`<div class="card center"><div class="huge">🏆</div><div class="big">Week finished!</div><div class="muted">You can practise any day again below.</div></div>`));
  }

  const list = $(`<div class="card"><div class="big" style="font-size:20px">This week</div></div>`);
  DAYS.forEach((d,i)=>{
    const r = S.results[i]; const un = isUnlocked(i);
    const el = $(`<button class="day ${r?'done':''} ${un?'':'locked'}">
        <div class="num">${r ? "✓" : i+1}</div>
        <div class="t"><div style="font-weight:600">Day ${i+1}: ${esc(d.title)}</div>
        <div class="muted">${r ? "Practise again" : un ? "Ready" : "Locked"}</div></div>
        <div class="stars">${r ? "⭐".repeat(starsFor(r.score)) : ""}</div></button>`);
    el.onclick = () => un ? startLesson(i) : say("This lesson opens later. Finish the one before it first.");
    list.appendChild(el);
  });
  app.appendChild(list);

  const vids = $(`<button class="btn alt">🎬 My workshop videos</button>`);
  vids.onclick = videosPage;
  app.appendChild(vids);
}

/* ================= LESSON ================= */
let L = null; // current lesson state
let timerInt = null;
function startTimer(){
  const el = document.getElementById("timer"); el.classList.remove("hidden");
  timerInt = setInterval(()=>{
    const s = Math.floor((Date.now()-L.start)/1000);
    el.textContent = `⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  },1000);
}
function stopTimer(){ clearInterval(timerInt); document.getElementById("timer").classList.add("hidden"); if("speechSynthesis" in window) speechSynthesis.cancel(); }

function startLesson(i){
  const d = DAYS[i];
  const steps = [];
  steps.push(()=>stepIntro(d,i));
  steps.push(()=>stepWords(d));
  d.pick.forEach(p=>steps.push(()=>stepPick(p)));
  steps.push(()=>stepSentence(d));
  steps.push(()=>stepChoice("Read and answer", d.question, d.sentence + (S.level>=2 ? " " + d.extra : "")));
  steps.push(()=>stepMathIntro());
  const mathCount = S.level >= 2 ? 4 : 3;
  d.math.slice(0,mathCount).forEach(m=>steps.push(()=>stepChoice("Numbers", m)));
  steps.push(()=>stepVideo(d));
  steps.push(()=>stepChoice("About the video", d.videoQ));
  steps.push(()=>stepTask(d));
  L = {day:i, steps, idx:0, right:0, total:0, start:Date.now()};
  setHeader(`Day ${i+1}: ${d.title}`, "✕ Stop", ()=>{ if(confirm("Stop the lesson? Your answers today will not be saved.")) home(); });
  startTimer();
  render();
}
function render(){
  app.innerHTML = "";
  const bar = $(`<div class="steps">${L.steps.map((_,k)=>`<span class="${k<=L.idx?'on':''}"></span>`).join("")}</div>`);
  app.appendChild(bar);
  L.steps[L.idx]();
}
function next(){ L.idx++; if (L.idx >= L.steps.length) finish(); else render(); }
function nextBtn(label="Next ➜", enabled=true){
  const b = $(`<button class="btn" ${enabled?'':'disabled'}>${label}</button>`);
  b.onclick = next; return b;
}

function stepIntro(d,i){
  const c = $(`<div class="card center">
     <div class="huge">${d.words[0].e}</div>
     <div class="big">Day ${i+1}: ${esc(d.title)}</div>
     <p class="muted">Today: 4 new words, one short reading, a few sums, and a car video.<br>About ${targetMinutes()} minutes.</p>
   </div>`);
  app.appendChild(c);
  const b = nextBtn("Let's start ➜");
  app.appendChild(b);
  say(`Hello. Welcome to day ${i+1}. Today we learn about ${d.title}. Tap the blue button to start.`);
}

function stepWords(d){
  const c = $(`<div class="card"><div class="big" style="font-size:22px">New words</div>
     <div class="muted">Tap each word. Listen. Then say it out loud.</div></div>`);
  const heard = new Set();
  const nb = nextBtn("Next ➜", false);
  d.words.forEach(w=>{
    const el = $(`<button class="wordcard"><span class="emoji">${w.e}</span><span class="w">${esc(w.w)}</span><span style="margin-left:auto;font-size:26px">🔊</span></button>`);
    el.onclick = ()=>{
      say(`${w.w}. ... ${w.w.split("").join(" ")}. ... ${w.w}.`);
      heard.add(w.w); el.style.borderColor = "var(--green)";
      if (heard.size === d.words.length) nb.disabled = false;
    };
    c.appendChild(el);
  });
  app.appendChild(c); app.appendChild(nb);
  say("Here are your new words. Tap each word to hear it. Then say it out loud.");
}

function stepPick(p){
  const c = $(`<div class="card center">
     <div class="big" style="font-size:22px">Listen and tap the word</div>
     <button class="speak" style="margin:12px auto;display:block">🔊</button>
     <div class="opts"></div><div class="feedback"></div></div>`);
  c.querySelector(".speak").onclick = ()=>say(p.say);
  addOptions(c, shuffle(p.opts), o => o === p.say, p.say);
  app.appendChild(c);
  say(`Listen. Tap the word: ${p.say}`);
}

function stepSentence(d){
  const text = d.sentence + (S.level>=2 ? " " + d.extra : "");
  const words = text.split(" ");
  const c = $(`<div class="card">
     <div class="big" style="font-size:22px">Read this</div>
     <div class="muted">First listen. Then read it out loud yourself.</div>
     <div class="sentence">${words.map((w,k)=>`<span class="wd" data-k="${k}">${esc(w)}</span>`).join(" ")}</div>
     <button class="btn alt">🔊 Listen</button>
     <button class="btn alt">🐢 Listen slowly, word by word</button>
   </div>`);
  const spans = [...c.querySelectorAll(".wd")];
  // map char index -> word index
  const starts = []; let pos = 0; words.forEach(w=>{ starts.push(pos); pos += w.length+1; });
  const clear = ()=>spans.forEach(s=>s.classList.remove("hl"));
  const [listen, slow] = c.querySelectorAll("button.btn");
  listen.onclick = ()=>{
    clear();
    say(text, ci=>{ let k = 0; for (let j=0;j<starts.length;j++) if (starts[j] <= ci) k = j; clear(); spans[k] && spans[k].classList.add("hl"); }, clear);
  };
  slow.onclick = ()=>{
    let k = 0;
    const step = ()=>{ clear(); if (k >= words.length || !c.isConnected) return; spans[k].classList.add("hl"); say(words[k].replace(/[.,!?]/g,""), null, ()=>{ k++; setTimeout(step, 350); }); };
    step();
  };
  spans.forEach((s,k)=> s.onclick = ()=>{ clear(); s.classList.add("hl"); say(words[k].replace(/[.,!?]/g,"")); });
  app.appendChild(c);
  app.appendChild(nextBtn("✔ I read it out loud"));
  setTimeout(()=>listen.click(), 300);
}

function stepMathIntro(){
  app.appendChild($(`<div class="card center"><div class="huge">🔢</div><div class="big">Numbers time</div><p class="muted">Workshop sums. Take your time. You can tap 🔊 to hear the question.</p></div>`));
  app.appendChild(nextBtn("Start ➜"));
  say("Now, numbers time. These are sums from the workshop. Take your time.");
}

function stepChoice(title, item, readText){
  const c = $(`<div class="card">
     <div class="muted">${esc(title)}</div>
     ${readText ? `<div class="sentence" style="font-size:22px">${esc(readText)}</div>` : ""}
     <div class="row" style="align-items:flex-start">
       <div style="flex:1;font-size:22px;font-weight:600">${esc(item.q)}</div>
       <button class="speak">🔊</button>
     </div>
     <div class="opts"></div><div class="feedback"></div></div>`);
  c.querySelector(".speak").onclick = ()=>say(item.q + " ... " + item.opts.join(". or. "));
  const right = item.opts[item.a];
  addOptions(c, item.opts, o => o === right, null, true);
  app.appendChild(c);
  say(item.q);
}

function addOptions(card, opts, isRight, sayOnTap, small){
  const box = card.querySelector(".opts"); const fb = card.querySelector(".feedback");
  let first = true, finished = false;
  opts.forEach(o=>{
    const b = $(`<button class="opt" ${small?'style="font-size:20px"':''}>${esc(o)}</button>`);
    b.onclick = ()=>{
      if (finished) return;
      if (isRight(o)){
        finished = true; b.classList.add("right");
        if (first) L.right++; L.total++;
        fb.className = "feedback ok"; const p = pickPraise(); fb.textContent = "✔ " + p;
        let moved = false;
        const go = ()=>{ if (moved || !card.isConnected) return; moved = true; next(); };
        say(p, null, ()=>setTimeout(go, 400));
        setTimeout(go, 3500);
      } else {
        if (first) { first = false; }
        b.classList.add("wrong");
        fb.className = "feedback no"; fb.textContent = "Not yet. Try again.";
        say("Not yet. Try again." + (sayOnTap ? " Listen. " + sayOnTap : ""));
      }
    };
    box.appendChild(b);
  });
}

function ytEmbed(id){ return `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`; }

function stepVideo(d){
  const v = d.video;
  const c = $(`<div class="card"><div class="big" style="font-size:22px">🎬 Car video</div>
     <div class="muted">${esc(v.title)}. Watch at least 5 minutes. Needs internet.</div></div>`);

  app.appendChild(nextBtn("✔ I watched it"));

function stepTask(d){
  app.appendChild($(`<div class="card"><div class="big" style="font-size:22px">📝 Today's task</div>
     <div class="sentence" style="font-size:22px">${esc(d.task)}</div>
     <button class="btn alt">🔊 Listen</button></div>`));
  app.querySelector(".card .btn.alt").onclick = ()=>say(d.task);
  app.appendChild(nextBtn("✔ Finish lesson"));
  say("Here is your task for today. " + d.task);
}

function finish(){
  stopTimer();
  const score = L.total ? L.right / L.total : 1;
  const mins = Math.max(1, Math.round((Date.now()-L.start)/60000));
  const firstTime = !S.results[L.day];
  const prev = S.results[L.day];
  S.results[L.day] = {
    score: prev ? Math.max(prev.score, score) : score,
    date: prev ? prev.date : today(),
    minutes: (prev ? prev.minutes : 0) + mins,
    tries: (prev ? prev.tries : 0) + 1
  };
  let levelMsg = "";
  if (firstTime){
    if (score >= .8){
      S.goodStreak++;
      if (S.goodStreak >= 2 && S.level < 6){ S.level++; S.goodStreak = 0; levelMsg = "You are doing very well. Next time the lesson will be a little longer."; }
    } else {
      S.goodStreak = 0;
      if (score < .5 && S.level > 1){ S.level--; levelMsg = "Next time we will go a little slower. That is okay."; }
    }
  }
  save();
  const st = starsFor(score);
  setHeader("Lesson done", "Home", home);
  app.innerHTML = "";
  app.appendChild($(`<div class="card center">
      <div class="huge">${"⭐".repeat(st)}</div>
      <div class="big">Lesson finished!</div>
      <p>${L.right} of ${L.total} right first time · ${mins} min</p>
      ${levelMsg ? `<p class="pill" style="font-size:15px">${esc(levelMsg)}</p>` : ""}
    </div>`));
  const b = $(`<button class="btn green">🏠 Home</button>`); b.onclick = home; app.appendChild(b);
  say(`Well done! You finished today's lesson. You got ${L.right} out of ${L.total}. ${levelMsg} See you tomorrow.`);
}

/* ================= PROGRESS (for Gideon) ================= */
function progressPage(){
  stopTimer();
  setHeader("Progress", "Home", home);
  const rows = DAYS.map((d,i)=>{

    return `<tr><td>Day ${i+1} ${esc(d.title)}</td><td>${r ? Math.round(r.score*100)+"%" : "–"}</td><td>${r ? r.minutes+" min" : "–"}</td><td>${r ? r.date : "–"}</td></tr>`;

     <div class="big" style="font-size:22px">How he is doing</div>
     <div class="row" style="margin:8px 0"><span class="pill">Level ${S.level}</span><span class="pill">${targetMinutes()} min/day</span><span class="pill">${total} min total</span></div>
     <table><tr><th>Lesson</th><th>Score</th><th>Time</th><th>Date</th></tr>${rows}</table>
     <p class="muted">Level goes up after 2 good days in a row (80% or more): a longer reading and one extra sum. It goes down if he scores under 50%.</p>
   </div>`));
  const set = $(`<div class="card"><div style="font-weight:600">Settings</div>
     <label class="row" style="margin-top:8px"><input type="checkbox" ${S.unlockAll?'checked':''}> Open all days (for testing)</label>
     <div style="font-weight:600;margin-top:16px">Voice</div>
     <p class="muted" style="margin:4px 0 8px">Pick the clearest voice. Voices with "Google" in the name usually sound best.</p>
     <select id="voicePick" style="width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)"></select>
     <button class="btn alt" id="voiceTest">🔊 Test this voice</button>
     <button class="btn alt" id="resetBtn">Reset all progress</button></div>`);
  const sel = set.querySelector("#voicePick");
  const vs = englishVoices();
  if (!vs.length) sel.innerHTML = `<option>No English voice found on this phone</option>`;
  vs.forEach(v=>{ const o = document.createElement("option"); o.value = v.name; o.textContent = `${v.name} (${v.lang})`; if (voice && v.name === voice.name) o.selected = true; sel.appendChild(o); });
  sel.onchange = ()=>{ S.voiceName = sel.value; save(); pickVoice(); say("Hello. This is the new voice."); };
  set.querySelector("#voiceTest").onclick = ()=>say("Hello. I have a spanner. It is in the box.");
  set.querySelector("input").onchange = e=>{ S.unlockAll = e.target.checked; save(); };
  set.querySelector("#resetBtn").onclick = ()=>{ if(confirm("Delete all progress and start again?")){ S = {level:1,goodStreak:0,results:{},unlockAll:false,myLinks:S.myLinks||[],slow:S.slow,voiceName:S.voiceName}; save(); home(); } };
  app.appendChild(set);
}

/* ================= MY VIDEOS ================= */
const DB_NAME = "learnfix_videos";
function db(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME,1);
    r.onupgradeneeded = ()=>r.result.createObjectStore("clips",{keyPath:"id",autoIncrement:true});
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
}
async function clipsAll(){ const d = await db(); return new Promise(res=>{ const q = d.transaction("clips").objectStore("clips").getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]); }); }
async function clipAdd(name, blob){ const d = await db(); return new Promise(res=>{ const t = d.transaction("clips","readwrite"); t.objectStore("clips").add({name, blob, added:today()}); t.oncomplete=res; }); }
async function clipDel(id){ const d = await db(); return new Promise(res=>{ const t = d.transaction("clips","readwrite"); t.objectStore("clips").delete(id); t.oncomplete=res; }); }
function ytId(url){ const m = String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : null; }

async function videosPage(fromLesson){
  const back = fromLesson && L ? ()=>render() : home;
  if (!fromLesson) stopTimer();
  setHeader("Workshop videos", fromLesson ? "Back" : "Home", back);
  app.innerHTML = "";
  const player = $(`<div></div>`); app.appendChild(player);

  const add = $(`<div class="card"><div style="font-weight:600">Add a video</div>
     <p class="muted">Record a short clip at the workshop with the phone camera, then add it here. It plays without data.</p>
     <input type="file" accept="video/*" class="hidden">
     <button class="btn alt">📁 Add a clip from this phone</button>
     <p class="muted" style="margin-top:14px">Or paste a YouTube link (needs data to play):</p>
     <input type="text" placeholder="https://youtu.be/...">
     <button class="btn alt">➕ Save link</button></div>`);
  const [file] = add.querySelectorAll('input[type=file]');
  const [txt] = add.querySelectorAll('input[type=text]');
  const [bFile, bLink] = add.querySelectorAll("button");
  bFile.onclick = ()=>file.click();
  file.onchange = async ()=>{
    const f = file.files[0]; if (!f) return;
    const name = prompt("Name for this clip:", f.name.replace(/\.[^.]+$/,"")) || f.name;
    try { await clipAdd(name, f); videosPage(fromLesson); } catch(e){ alert("Could not save the clip. The phone may be full."); }
  };
  bLink.onclick = ()=>{
    const id = ytId(txt.value); if (!id){ alert("That does not look like a YouTube link."); return; }
    const name = prompt("Name for this video:", "Workshop video") || "Video";
    S.myLinks = S.myLinks || []; S.myLinks.push({id, name}); save(); videosPage(fromLesson);
  };

  const list = $(`<div class="card"><div style="font-weight:600">Saved videos</div></div>`);
  const clips = await clipsAll().catch(()=>[]);
  const links = S.myLinks || [];
  if (!clips.length && !links.length) list.appendChild($(`<p class="muted">No videos yet.</p>`));
  clips.forEach(c=>{
    const el = $(`<div class="day"><div class="num">📁</div><div class="t"><div style="font-weight:600">${esc(c.name)}</div><div class="muted">On this phone · no data needed</div></div><button class="opt" style="font-size:14px;padding:8px">Delete</button></div>`);
    el.querySelector(".t").onclick = ()=>{
      const url = URL.createObjectURL(c.blob);
      player.innerHTML = `<div class="card"><div style="font-weight:600">${esc(c.name)}</div><div class="video"><video src="${url}" controls playsinline autoplay></video></div></div>`;
      window.scrollTo(0,0);
    };
    el.querySelector("button").onclick = async ()=>{ if(confirm("Delete this clip?")){ await clipDel(c.id); videosPage(fromLesson); } };
    list.appendChild(el);
  });
  links.forEach((v,k)=>{
    const el = $(`<div class="day"><div class="num">▶</div><div class="t"><div style="font-weight:600">${esc(v.name)}</div><div class="muted">YouTube · needs data</div></div><button class="opt" style="font-size:14px;padding:8px">Delete</button></div>`);
    el.querySelector(".t").onclick = ()=>{ player.innerHTML = `<div class="card"><div style="font-weight:600">${esc(v.name)}</div>${ytEmbed(v.id)}</div>`; window.scrollTo(0,0); };
    el.querySelector("button").onclick = ()=>{ if(confirm("Delete this link?")){ S.myLinks.splice(k,1); save(); videosPage(fromLesson); } };
    list.appendChild(el);
  });
  app.appendChild(list);
  app.appendChild(add);
}

}
